name: Release plugin

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Which version segment to bump
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
          - revision

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Bump <Version> in AnoMech.csproj (major/minor/patch/revision)
      - name: Bump version
        id: bump
        shell: pwsh
        run: |
          $csproj = "AnoMech/AnoMech.csproj"
          $bump = "${{ inputs.version_bump }}".ToLower()
          $idx = @{ 'major' = 0; 'minor' = 1; 'patch' = 2; 'revision' = 3 }
          if (-not $idx.ContainsKey($bump)) { throw "Invalid version_bump '$bump'" }
          $content = Get-Content $csproj -Raw
          $rx = '<Version>\s*([0-9]+(?:\.[0-9]+){0,3})\s*</Version>'
          $m = [regex]::Match($content, $rx)
          if (-not $m.Success) { throw "No <Version> element found in $csproj" }
          $parts = @($m.Groups[1].Value.Split('.') | ForEach-Object { [int]$_ })
          while ($parts.Count -lt 4) { $parts += 0 }
          $i = $idx[$bump]
          $parts[$i] = $parts[$i] + 1
          for ($j = $i + 1; $j -lt 4; $j++) { $parts[$j] = 0 }
          $new = ($parts -join '.')
          $content = [regex]::Replace($content, $rx, "<Version>$new</Version>")
          [System.IO.File]::WriteAllText((Resolve-Path $csproj).Path, $content)
          Write-Host "Bumped $bump : $($m.Groups[1].Value) -> $new"
          "version=$new" >> $env:GITHUB_OUTPUT

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud (needed to build)
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build solution
        run: dotnet build AnoMech.sln --configuration Release

      # Commit the version bump so the release tag matches the bumped csproj.
      - name: Commit version bump
        uses: EndBug/add-and-commit@v9
        with:
          add: AnoMech/AnoMech.csproj
          message: Bump AnoMech to v${{ steps.bump.outputs.version }}
          default_author: user_info

      # Locate the plugin's own build output (exclude tests/ and obj/).
      - name: Find plugin output directory
        id: output
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter "AnoMech.dll" |
            Where-Object { $_.FullName -notlike "*tests*" -and $_.FullName -notlike "*obj*" } |
            Select-Object -First 1
          if (-not $dll) { throw "AnoMech.dll not found after build" }
          $dir = $dll.DirectoryName
          Write-Host "Plugin output dir: $dir"
          "dir=$dir" >> $env:GITHUB_OUTPUT
          "manifest=$dir/AnoMech.json" >> $env:GITHUB_OUTPUT

      # Package the build output into latest.zip (next to the dll).
      - name: Package plugin zip
        shell: pwsh
        run: |
          $dir = "${{ steps.output.outputs.dir }}"
          Get-ChildItem $dir -File | Where-Object { $_.Name -ne "latest.zip" } |
            Compress-Archive -DestinationPath "$dir\latest.zip" -Force
          Write-Host "Packaged $dir\latest.zip"

      # Stage the zip + manifest into plugins/AnoMech for the Dalamud repo.
      - name: Stage plugin package into plugins/AnoMech
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "plugins/AnoMech" | Out-Null
          Copy-Item "${{ steps.output.outputs.manifest }}" "plugins/AnoMech/AnoMech.json" -Force
          Copy-Item "${{ steps.output.outputs.dir }}\latest.zip" "plugins/AnoMech/latest.zip" -Force

      # Regenerate pluginmaster.json (no GitHub API / PAT needed).
      - name: Regenerate Dalamud repo manifest
        shell: pwsh
        run: python generate_pluginmaster.py

      - name: Commit plugin package + manifest
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            plugins/AnoMech/AnoMech.json
            plugins/AnoMech/latest.zip
            pluginmaster.json
          message: Release AnoMech v${{ steps.bump.outputs.version }}
          default_author: user_info

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: Release v${{ steps.bump.outputs.version }} — see installation.md for install instructions.
          files: plugins/AnoMech/latest.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}
